<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Financial System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class = "app-layout">
        <aside class = "sidebar">
            <h2>ACCOUNTING</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="transactionform.html" class="active">Transactions</a>
                <a href="#">Project</a>
                <a href="#">Financial Statement</a>
            </nav>
        </aside>
        
        <div class="main-content">
            <header class="topbar">
                <h1>Transactions</h1>
                <span class="user-icon"></span>
            </header>

            <main id="inputScreen">
                

            <section class="transaction-form-card">
                <h2>Add transaction</h2>
                <form id="transactionForm">
                    <label for="transactionType">Transaction Type</label>
                    <select id="transactionType" required>
                        <option value="">Select types</option>
                        <option value="Revenue">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                    <label for="description">Description</label>
                    <input
                        type="text" id="description" required>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Services">Services</option>
                        <option value="Materials">Materials</option>
                        <option value="Labor">Labor</option>
                        <option value="Rent">Rent</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Other">Other</option>
                    </select>
                    <label for="amount">Amount</label>
                    <input 
                        type="number" id="amount" min="0" step="0.01" required>
                    <label for="date">Date</label>
                    <input 
                        type="date" id="date" required>
                    <button type="submit">Save Transaction</button>
                </form>
            </section>

            </main>
            <section class="dashboardcard transaction-list-card">
                <h2>Transaction List</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable"></tbody>
                </table>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
